<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Official Letters & Documents — BSEBwala</title>
    <meta name="description" content="Official letters, eGazettes, notifications, and advertisements from the Bihar School Examination Board and Education Department.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- Color Scheme matching "Live Updates & News" (Image 3) --- */
        :root {
            --primary-color: #a855f7; /* Purple */
            --primary-hover: #9333ea;
            --bg-color: #fdfafr; /* Soft light pink/purple tint background */
            --list-bg: #ffffff;
            --list-hover: #faf5ff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e9d5ff; /* Soft purple border */
            
            --badge-bg: #f3e8ff;
            --badge-text: #6b21a8;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --list-bg: #1f2937;
            --list-hover: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #4b5563;
            --badge-bg: #374151;
            --badge-text: #d8b4fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* --- Header Actions --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-btn {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* --- Controls Section (Search & Filter dropdowns based on Image 1 & 2) --- */
        .doc-controls {
            max-width: 1000px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .doc-controls {
                grid-template-columns: 2fr 1fr 1fr; /* Search is wider */
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 0.2rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--list-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
            box-sizing: border-box;
            appearance: none; /* For selects */
        }
        
        select.form-control {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- Compact Linear List --- */
        .doc-container {
            max-width: 1000px;
            margin: 0 auto 4rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem; /* Gap between compact rows */
        }

        .doc-row {
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem; /* Much tighter padding */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--list-bg);
            transition: transform 0.1s, box-shadow 0.2s;
            gap: 0.5rem;
        }

        .doc-row:hover {
            background-color: var(--list-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(168, 85, 247, 0.1); /* Soft purple shadow */
        }

        @media (min-width: 768px) {
            .doc-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0.6rem 1rem; /* Ultra compact on desktop */
            }
        }

        .doc-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        @media (min-width: 768px) {
            .doc-info {
                flex-direction: row;
                align-items: center;
                gap: 1.5rem;
            }
        }

        .doc-meta-primary {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 150px;
        }

        .doc-sl {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .doc-type-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
        }

        .doc-title {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-meta-secondary {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
            min-width: 140px;
        }

        .download-btn {
            background-color: #22c55e; /* Green download button like image 1 */
            color: #ffffff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            transition: background-color 0.2s;
            white-space: nowrap;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #16a34a;
        }
        
        .no-results {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="site">
        <div class="wrap header-inner">
            <a href="index.html" class="brand">
                <div class="mark">BB</div>
                <span class="full">BSEB Portal Hub</span>
            </a>
            <nav class="main-nav">
                <a href="https://bsebwala.in/">Home</a>
                <a href="letter.html" class="active">Documents</a>
            </nav>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle">हिंदी में देखें</button>
                <button class="icon-btn" id="themeToggle">🌙</button>
                <button class="icon-btn menu-toggle-btn" id="menuToggle">☰</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- Search and Filter Controls (3 Columns) -->
        <section class="doc-controls">
            <div class="control-group">
                <label class="control-label" id="lblSearch">Search</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Title or keyword...">
            </div>
            
            <div class="control-group">
                <label class="control-label" id="lblCategory">Category</label>
                <select id="categoryFilter" class="form-control">
                    <option value="all" id="optCatAll">All</option>
                    <option value="letter" id="optCatLetter">Circular / Letter</option>
                    <option value="order" id="optCatOrder">Order</option>
                    <option value="notification" id="optCatNotif">Notification</option>
                    <option value="scheme" id="optCatScheme">Scheme</option>
                    <option value="other" id="optCatOther">Other</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label" id="lblSort">Sort By</label>
                <select id="sortFilter" class="form-control">
                    <option value="newest" id="optSortNew">Newest First</option>
                    <option value="oldest" id="optSortOld">Oldest First</option>
                    <option value="az" id="optSortAZ">Alphabetically (A-Z)</option>
                    <option value="za" id="optSortZA">Alphabetically (Z-A)</option>
                </select>
            </div>
        </section>

        <!-- Compact Document List Container -->
        <section class="doc-container" id="documentList"></section>
    </main>

    <!-- SCRIPTS -->
    <script>
        /* ---------- STATE & TRANSLATIONS ---------- */
        let currentLang = 'en'; // 'en' or 'hi'
        let currentFilter = 'all';
        let currentSort = 'newest';
        let searchQuery = '';

        const translations = {
            en: {
                toggleBtn: "हिंदी में देखें",
                lblSearch: "Search",
                phSearch: "Title or keyword...",
                lblCategory: "Category",
                lblSort: "Sort By",
                cats: { all: "All", letter: "Circular / Letter", order: "Order", notif: "Notification", scheme: "Scheme", other: "Other" },
                sorts: { new: "Newest First", old: "Oldest First", az: "Alphabetically (A-Z)", za: "Alphabetically (Z-A)" },
                download: "Download",
                noResult: "No documents found."
            },
            hi: {
                toggleBtn: "View in English",
                lblSearch: "खोज",
                phSearch: "शीर्षक या लिखावट...",
                lblCategory: "श्रेणी",
                lblSort: "क्रम",
                cats: { all: "सभी", letter: "परिपत्र", order: "आदेश", notif: "अधिसूचना", scheme: "योजना", other: "अन्य" },
                sorts: { new: "नया पहले", old: "पुराना पहले", az: "अक्षर क्रमानुसार (A-Z)", za: "अक्षर क्रमानुसार (Z-A)" },
                download: "डाउनलोड",
                noResult: "कोई दस्तावेज़ नहीं मिला।"
            }
        };

        /* ---------- MOCK DATABASE ---------- */
        const documentDatabase = [
            {
                sl: "DOC-2026-010",
                title: {
                    en: "SMC Formation and Night Guard Deployment",
                    hi: "SMC गठन एवं रात्रि प्रहरी की बहाली"
                },
                category: "other",
                fileType: "PDF",
                date: "2026-10-11", // ISO format for easy sorting
                fileName: "smc_guard_2026.pdf",
                fileUrl: "#"
            },
            {
                sl: "DOC-2026-009",
                title: {
                    en: "BSEB Class 10th Final Exam Schedule",
                    hi: "BSEB 10वीं बोर्ड परीक्षा का कार्यक्रम"
                },
                category: "notification",
                fileType: "IMG",
                date: "2026-10-10",
                fileName: "10th_schedule.jpg",
                fileUrl: "#"
            },
            {
                sl: "DOC-2026-008",
                title: {
                    en: "District Level Teacher Training Circular",
                    hi: "जिला स्तरीय शिक्षक प्रशिक्षण परिपत्र"
                },
                category: "letter",
                fileType: "PDF",
                date: "2026-10-05",
                fileName: "training_oct.pdf",
                fileUrl: "#"
            },
            {
                sl: "DOC-2026-007",
                title: {
                    en: "Revised Holiday Calendar for November",
                    hi: "नवंबर माह हेतु संशोधित अवकाश कैलेंडर"
                },
                category: "order",
                fileType: "DOC",
                date: "2026-10-01",
                fileName: "holiday_nov.docx",
                fileUrl: "#"
            }
        ];

        /* ---------- DOM ELEMENTS ---------- */
        const els = {
            list: document.getElementById('documentList'),
            search: document.getElementById('searchInput'),
            cat: document.getElementById('categoryFilter'),
            sort: document.getElementById('sortFilter'),
            langBtn: document.getElementById('langToggle')
        };

        /* ---------- RENDERING LOGIC ---------- */
        function applyTranslations() {
            const t = translations[currentLang];
            
            els.langBtn.textContent = t.toggleBtn;
            document.getElementById('lblSearch').textContent = t.lblSearch;
            els.search.placeholder = t.phSearch;
            document.getElementById('lblCategory').textContent = t.lblCategory;
            document.getElementById('lblSort').textContent = t.lblSort;

            document.getElementById('optCatAll').textContent = t.cats.all;
            document.getElementById('optCatLetter').textContent = t.cats.letter;
            document.getElementById('optCatOrder').textContent = t.cats.order;
            document.getElementById('optCatNotif').textContent = t.cats.notif;
            document.getElementById('optCatScheme').textContent = t.cats.scheme;
            document.getElementById('optCatOther').textContent = t.cats.other;

            document.getElementById('optSortNew').textContent = t.sorts.new;
            document.getElementById('optSortOld').textContent = t.sorts.old;
            document.getElementById('optSortAZ').textContent = t.sorts.az;
            document.getElementById('optSortZA').textContent = t.sorts.za;
        }

        function renderDocuments() {
            // 1. Filter
            let filtered = documentDatabase.filter(doc => {
                const matchCat = currentFilter === 'all' || doc.category === currentFilter;
                const query = searchQuery.toLowerCase();
                const matchSearch = doc.title[currentLang].toLowerCase().includes(query) || 
                                    doc.sl.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            // 2. Sort
            filtered.sort((a, b) => {
                if (currentSort === 'newest') return new Date(b.date) - new Date(a.date);
                if (currentSort === 'oldest') return new Date(a.date) - new Date(b.date);
                if (currentSort === 'az') return a.title[currentLang].localeCompare(b.title[currentLang]);
                if (currentSort === 'za') return b.title[currentLang].localeCompare(a.title[currentLang]);
            });

            // 3. Render
            els.list.innerHTML = '';
            const t = translations[currentLang];

            if (filtered.length === 0) {
                els.list.innerHTML = `<div class="no-results">${t.noResult}</div>`;
                return;
            }

            filtered.forEach(doc => {
                // Formatting date: YYYY-MM-DD -> DD/MM/YYYY
                const parts = doc.date.split('-');
                const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;

                const row = document.createElement('div');
                row.className = 'doc-row';
                row.innerHTML = `
                    <div class="doc-info">
                        <div class="doc-meta-primary">
                            <span class="doc-sl">${doc.sl}</span>
                            <span class="doc-type-badge">${doc.fileType}</span>
                        </div>
                        <h2 class="doc-title" title="${doc.title[currentLang]}">${doc.title[currentLang]}</h2>
                        <div class="doc-meta-secondary">
                            <span>📅 ${formattedDate}</span>
                        </div>
                    </div>
                    <a href="${doc.fileUrl}" download="${doc.fileName}" class="download-btn">
                        ${t.download}
                    </a>
                `;
                els.list.appendChild(row);
            });
        }

        /* ---------- EVENT LISTENERS ---------- */
        els.langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyTranslations();
            renderDocuments();
        });

        els.search.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderDocuments();
        });

        els.cat.addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderDocuments();
        });

        els.sort.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderDocuments();
        });

        // Initialize
        applyTranslations();
        renderDocuments();

        /* ---------- THEME TOGGLE (Preserved) ---------- */
        (function themeModule(){
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            function apply(theme){
                theme === 'dark' ? root.setAttribute('data-theme', 'dark') : root.removeAttribute('data-theme');
                btn.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
            let saved = localStorage.getItem('bseb-hub-theme');
            apply(saved || 'light');
            btn.addEventListener('click', () => {
                const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                apply(next);
                localStorage.setItem('bseb-hub-theme', next);
            });
        })();
    </script>
</body>
</html>
