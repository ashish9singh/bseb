<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Official Letters & Documents — BSEBwala</title>
    <meta name="description" content="Official letters, eGazettes, notifications, and advertisements from the Bihar School Examination Board and Education Department.">

    <!-- ========================================== -->
    <!-- EXTERNAL RESOURCES                         -->
    <!-- ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- ========================================== -->
    <!-- PAGE-SPECIFIC STYLES                       -->
    <!-- ========================================== -->
    <style>
        /* --- 1. Color Scheme & Variables --- */
        :root {
            --primary-color: #a855f7;       
            --primary-hover: #9333ea;
            --bg-color: #fdfafr;            
            --list-bg: #ffffff;             
            --list-hover: #faf5ff;          
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e9d5ff;        
            
            --badge-bg: #f3e8ff;            
            --badge-text: #6b21a8;          
            --cat-bg: #f3f4f6;              
            --cat-text: #4b5563;            
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] {
            --bg-color: #111827;
            --list-bg: #1f2937;
            --list-hover: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #4b5563;
            --badge-bg: #374151;
            --badge-text: #d8b4fe;
            --cat-bg: #4b5563;
            --cat-text: #e5e7eb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* --- 2. Header & Buttons --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-btn {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* --- 3. Filter & Search Controls --- */
        .doc-controls {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .doc-controls {
                grid-template-columns: 2fr 1fr 1fr; 
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 0.2rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--list-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
            box-sizing: border-box;
            appearance: none;
        }
        
        select.form-control {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- 4. Document List & Rows (Perfect Linear Alignment) --- */
        .doc-container {
            max-width: 1200px;
            margin: 0 auto 4rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .doc-row {
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--list-bg);
            transition: transform 0.1s, box-shadow 0.2s;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .doc-row:hover {
            background-color: var(--list-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(168, 85, 247, 0.1);
        }

        .doc-info-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            flex: 1;
            width: 100%;
        }

        .doc-sl {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .doc-type-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .doc-cat-badge {
            font-size: 0.75rem;
            font-weight: 500;
            background-color: var(--cat-bg);
            color: var(--cat-text);
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            white-space: nowrap;
        }

        .doc-text-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0; /* Ensures truncation works inside flexbox */
            justify-content: center;
        }

        .doc-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            /* Strictly single line */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            /* Strictly single line */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-info-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            justify-content: space-between;
        }

        .doc-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* --- DESKTOP SPECIFIC: FIXED WIDTHS FOR PERFECT LINEAR ALIGNMENT --- */
        @media (min-width: 768px) {
            .doc-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0.6rem 1rem;
                gap: 1rem;
            }
            
            .doc-info-left {
                flex-wrap: nowrap;
                width: auto;
            }
            
            /* Fixed columns for exact vertical alignment down the page */
            .doc-sl {
                width: 110px;
                flex-shrink: 0;
            }
            
            .doc-type-badge {
                width: 40px;
                text-align: center;
                flex-shrink: 0;
            }
            
            .doc-cat-badge {
                width: 130px;
                text-align: center;
                flex-shrink: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .doc-info-right {
                width: auto;
                justify-content: flex-end;
                flex-shrink: 0;
            }
        }

        /* --- 5. Download Button --- */
        .download-btn {
            background-color: #22c55e; 
            color: #ffffff;
            border: none;
            padding: 0.4rem 1.25rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s;
            white-space: nowrap;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #16a34a;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1rem;
            background-color: var(--list-bg);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="site">
        <div class="wrap header-inner">
            <a href="index.html" class="brand">
                <div class="mark">BB</div>
                <span class="full">BSEB Portal Hub</span>
            </a>
            <nav class="main-nav">
                <a href="https://bsebwala.in/">Home</a>
                <a href="aihub.html">AIHub</a>
                <a href="letter.html" class="active">Letter</a>
                <a href="fee.html">Fee</a> 
                <a href="news.html">News</a> 
                <a href="about.html">About</a> 
                <a href="contact.html">Contact</a>
            </nav>
            
            <div class="header-actions">
                <button class="lang-btn" id="langToggle">हिंदी में देखें</button>
                <button class="icon-btn" id="themeToggle" title="Toggle Theme">🌙</button>
                <button class="icon-btn menu-toggle-btn" id="menuToggle">☰</button>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT                               -->
    <!-- ========================================== -->
    <main>
        
        <!-- Controls: Search, Category, Sort -->
        <section class="doc-controls">
            <div class="control-group">
                <label class="control-label" id="lblSearch">Search</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Title or keyword...">
            </div>
            
            <div class="control-group">
                <label class="control-label" id="lblCategory">Category</label>
                <select id="categoryFilter" class="form-control">
                    <option value="all" id="optCatAll">All</option>
                    <option value="circular" id="optCatCircular">Circular</option>
                    <option value="order" id="optCatOrder">Order</option>
                    <option value="notification" id="optCatNotif">Notification</option>
                    <option value="scheme" id="optCatScheme">Scheme</option>
                    <option value="other" id="optCatOther">Other</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label" id="lblSort">Sort By</label>
                <select id="sortFilter" class="form-control">
                    <option value="newest" id="optSortNew">Newest First</option>
                    <option value="oldest" id="optSortOld">Oldest First</option>
                    <option value="az" id="optSortAZ">Alphabetically (A-Z)</option>
                    <option value="za" id="optSortZA">Alphabetically (Z-A)</option>
                </select>
            </div>
        </section>

        <!-- Document List Area -->
        <section class="doc-container" id="documentList">
            <!-- Documents will be rendered here by JavaScript -->
        </section>
    </main>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC                           -->
    <!-- ========================================== -->
    <script>
        
        /* =========================================================================
           1. DOCUMENT DATABASE (EASY TO EDIT)
           ========================================================================= */

        const documentDatabase = [
            // --- ADD NEW RECORDS DIRECTLY BELOW THIS LINE ---

            {
                sl: "DOC-2026-010",
                title: {
                    en: "SMC Formation and Night Guard Deployment",
                    hi: "SMC गठन एवं रात्रि प्रहरी की बहाली"
                },
                desc: {
                    en: "Guidelines regarding the deployment of night guards across primary schools.",
                    hi: "प्राथमिक विद्यालयों में रात्रि प्रहरी की तैनाती के संबंध में दिशानिर्देश।"
                },
                category: "other",
                fileType: "PDF",
                date: "2026-10-11", 
                fileName: "smc_guard_2026.pdf",
                fileUrl: "assets/docs/smc_guard_2026.pdf"
            },
            {
                sl: "DOC-2026-009",
                title: {
                    en: "BSEB Class 10th Final Exam Schedule",
                    hi: "BSEB 10वीं बोर्ड परीक्षा का कार्यक्रम"
                },
                desc: {
                    en: "Official timetable for the matriculation examinations 2027.",
                    hi: "मैट्रिक परीक्षा 2027 के लिए आधिकारिक समय सारिणी।"
                },
                category: "notification",
                fileType: "IMG",
                date: "2026-10-10",
                fileName: "10th_schedule.jpg",
                fileUrl: "assets/docs/10th_schedule.jpg"
            },
            {
                sl: "DOC-2026-008",
                title: {
                    en: "District Level Teacher Training Details",
                    hi: "जिला स्तरीय शिक्षक प्रशिक्षण का विवरण"
                },
                desc: {
                    en: "Mandatory FLN training modules for teachers starting next week.",
                    hi: "अगले सप्ताह से शुरू होने वाले शिक्षकों के लिए अनिवार्य FLN प्रशिक्षण।"
                },
                category: "circular", // Changed from letter to circular
                fileType: "PDF",
                date: "2026-10-05",
                fileName: "training_oct.pdf",
                fileUrl: "assets/docs/training_oct.pdf"
            },
            {
                sl: "DOC-2026-007",
                title: {
                    en: "Revised Holiday Calendar for November",
                    hi: "नवंबर माह हेतु संशोधित अवकाश कैलेंडर"
                },
                desc: {
                    en: "Updated leaves for Chhath Puja and Diwali across all state schools.",
                    hi: "सभी राज्य के स्कूलों में छठ पूजा और दिवाली के लिए अद्यतन छुट्टियां।"
                },
                category: "order",
                fileType: "DOC",
                date: "2026-10-01",
                fileName: "holiday_nov.docx",
                fileUrl: "assets/docs/holiday_nov.docx"
            }

            // --- ADD OLDER RECORDS ABOVE THIS LINE ---
        ];


        /* =========================================================================
           2. STATE & TRANSLATIONS
           ========================================================================= */
        let currentLang = 'en'; 
        let currentFilter = 'all';
        let currentSort = 'newest';
        let searchQuery = '';

        const translations = {
            en: {
                toggleBtn: "हिंदी में देखें",
                lblSearch: "Search",
                phSearch: "Title or keyword...",
                lblCategory: "Category",
                lblSort: "Sort By",
                cats: { all: "All", circular: "Circular", order: "Order", notif: "Notification", scheme: "Scheme", other: "Other" },
                sorts: { new: "Newest First", old: "Oldest First", az: "Alphabetically (A-Z)", za: "Alphabetically (Z-A)" },
                download: "Download",
                noResult: "No documents found matching your criteria."
            },
            hi: {
                toggleBtn: "View in English",
                lblSearch: "खोज",
                phSearch: "शीर्षक या लिखावट...",
                lblCategory: "श्रेणी",
                lblSort: "क्रम",
                cats: { all: "सभी", circular: "परिपत्र", order: "आदेश", notif: "अधिसूचना", scheme: "योजना", other: "अन्य" },
                sorts: { new: "नया पहले", old: "पुराना पहले", az: "अक्षर क्रमानुसार (A-Z)", za: "अक्षर क्रमानुसार (Z-A)" },
                download: "डाउनलोड",
                noResult: "आपकी खोज से मेल खाने वाला कोई दस्तावेज़ नहीं मिला।"
            }
        };

        /* =========================================================================
           3. CORE RENDERING LOGIC
           ========================================================================= */
        const els = {
            list: document.getElementById('documentList'),
            search: document.getElementById('searchInput'),
            cat: document.getElementById('categoryFilter'),
            sort: document.getElementById('sortFilter'),
            langBtn: document.getElementById('langToggle')
        };

        function applyTranslations() {
            const t = translations[currentLang];
            
            els.langBtn.textContent = t.toggleBtn;
            document.getElementById('lblSearch').textContent = t.lblSearch;
            els.search.placeholder = t.phSearch;
            document.getElementById('lblCategory').textContent = t.lblCategory;
            document.getElementById('lblSort').textContent = t.lblSort;

            document.getElementById('optCatAll').textContent = t.cats.all;
            document.getElementById('optCatCircular').textContent = t.cats.circular;
            document.getElementById('optCatOrder').textContent = t.cats.order;
            document.getElementById('optCatNotif').textContent = t.cats.notif;
            document.getElementById('optCatScheme').textContent = t.cats.scheme;
            document.getElementById('optCatOther').textContent = t.cats.other;

            document.getElementById('optSortNew').textContent = t.sorts.new;
            document.getElementById('optSortOld').textContent = t.sorts.old;
            document.getElementById('optSortAZ').textContent = t.sorts.az;
            document.getElementById('optSortZA').textContent = t.sorts.za;
        }

        function renderDocuments() {
            let filtered = documentDatabase.filter(doc => {
                const matchCat = currentFilter === 'all' || doc.category === currentFilter;
                const query = searchQuery.toLowerCase();
                const matchSearch = doc.title[currentLang].toLowerCase().includes(query) || 
                                    doc.desc[currentLang].toLowerCase().includes(query) ||
                                    doc.sl.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            filtered.sort((a, b) => {
                if (currentSort === 'newest') return new Date(b.date) - new Date(a.date);
                if (currentSort === 'oldest') return new Date(a.date) - new Date(b.date);
                if (currentSort === 'az') return a.title[currentLang].localeCompare(b.title[currentLang]);
                if (currentSort === 'za') return b.title[currentLang].localeCompare(a.title[currentLang]);
            });

            els.list.innerHTML = '';
            const t = translations[currentLang];

            if (filtered.length === 0) {
                els.list.innerHTML = `<div class="no-results">${t.noResult}</div>`;
                return;
            }

            filtered.forEach(doc => {
                const parts = doc.date.split('-');
                const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                const translatedCategory = t.cats[doc.category] || doc.category;

                const row = document.createElement('div');
                row.className = 'doc-row';
                
                row.innerHTML = `
                    <div class="doc-info-left">
                        <span class="doc-sl">${doc.sl}</span>
                        <span class="doc-type-badge">${doc.fileType}</span>
                        <span class="doc-cat-badge">${translatedCategory}</span>
                        
                        <div class="doc-text-group">
                            <h2 class="doc-title" title="${doc.title[currentLang]}">${doc.title[currentLang]}</h2>
                            <span class="doc-desc" title="${doc.desc[currentLang]}">${doc.desc[currentLang]}</span>
                        </div>
                    </div>
                    
                    <div class="doc-info-right">
                        <span class="doc-date">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> 
                            ${formattedDate}
                        </span>
                        
                        <a href="${doc.fileUrl}" download="${doc.fileName}" class="download-btn">
                            ${t.download}
                        </a>
                    </div>
                `;
                els.list.appendChild(row);
            });
        }

        /* =========================================================================
           4. EVENT LISTENERS
           ========================================================================= */
        
        els.langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyTranslations();
            renderDocuments();
        });

        els.search.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderDocuments();
        });

        els.cat.addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderDocuments();
        });

        els.sort.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderDocuments();
        });

        applyTranslations();
        renderDocuments();

        /* =========================================================================
           5. THEME & MENU TOGGLE MODULES
           ========================================================================= */
        
        (function themeModule(){
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            
            function apply(theme){
                if (theme === 'dark') {
                    root.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️';
                } else {
                    root.removeAttribute('data-theme');
                    btn.textContent = '🌙';
                }
            }
            
            let saved = localStorage.getItem('bseb-hub-theme');
            apply(saved || 'light');
            
            btn.addEventListener('click', () => {
                const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                apply(next);
                localStorage.setItem('bseb-hub-theme', next);
            });
        })();

        (function mobileMenu() {
            const menuBtn = document.getElementById('menuToggle');
            const nav = document.querySelector('.main-nav');
            if (menuBtn && nav) {
                menuBtn.addEventListener('click', () => {
                    nav.classList.toggle('open');
                    menuBtn.innerHTML = nav.classList.contains('open') ? '✕' : '☰';
                });
            }
        })();
    </script>
</body>
</html>
