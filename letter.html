<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Official Letters — BSEBwala</title>
    <meta name="description" content="Official letters and circulars from the Bihar School Examination Board and Education Department.">

    <!-- Google Fonts: Lora for headings, Inter for body/UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- LINK TO YOUR NEW EXTERNAL CSS FILE -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- HEADER -->
    <header class="site">
        <div class="wrap header-inner">
            <div class="brand">
                <div class="mark">BB</div>
                <span class="full">BSEB Portal Hub</span>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="letter.html" class="active">Letter</a>
                <a href="fee.html">Fee</a>
                <a href="news.html">News</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="splash-card">
            <div class="splash-icon">📩</div>
            <h1>Official Letters Archive</h1>
            <p>We are building a highly searchable database of all official notifications, circulars, and departmental letters from BSEB and the Education Department.</p>
            <p><strong>Coming Soon.</strong></p>
            <a href="index.html" class="back-btn">← Return to Homepage</a>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script>
        /* ---------- THEME TOGGLE ---------- */
        (function themeModule(){
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            const STORAGE_KEY = 'bseb-hub-theme';

            function apply(theme){
                if (theme === 'dark' || theme === 'light'){
                    root.setAttribute('data-theme', theme);
                } else {
                    root.removeAttribute('data-theme');
                }
                btn.textContent = (root.getAttribute('data-theme') === 'dark' ||
                (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches))
                ? '☀️' : '🌙';
            }

            let saved = null;
            try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
            apply(saved);

            btn.addEventListener('click', function(){
                const current = root.getAttribute('data-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                const next = current === 'dark' ? 'light' : 'dark';
                apply(next);
                try { localStorage.setItem(STORAGE_KEY, next); } catch(e){}
            });
        })();

        /* ---------- COMING SOON TOOLTIP ---------- */
        (function comingSoonModule() {
            const tooltip = document.createElement('div');
            tooltip.className = 'coming-soon-tooltip';
            tooltip.innerHTML = 'Page is coming soon 🚀';
            document.body.appendChild(tooltip);

            let hideTimeout;

            document.querySelectorAll('.coming-soon').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    const rect = this.getBoundingClientRect();
                    tooltip.style.left = (rect.left + (rect.width / 2) + window.scrollX) + 'px';
                    tooltip.style.top = (rect.bottom + window.scrollY + 10) + 'px';
                    tooltip.classList.add('show');
                    
                    clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        tooltip.classList.remove('show');
                    }, 2000);
                });
            });
        })();
    </script>
</body>
</html>
