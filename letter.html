<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Official Letters & Documents — BSEBwala</title>
    <meta name="description" content="Official circulars, eGazettes, notifications, and advertisements from the Bihar School Examination Board and Education Department.">

    <!-- ========================================== -->
    <!-- EXTERNAL RESOURCES                         -->
    <!-- ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- ========================================== -->
    <!-- PAGE-SPECIFIC STYLES                       -->
    <!-- ========================================== -->
    <style>
        /* --- 1. Color Scheme & Variables --- */
        :root {
            --primary-color: #a855f7;       
            --primary-hover: #9333ea;
            --bg-color: #fdfafr;            
            --list-bg: #ffffff;             
            --list-hover: #faf5ff;          
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e9d5ff;        
            
            --badge-bg: #f3e8ff;            
            --badge-text: #6b21a8;          
            --cat-bg: #f3f4f6;              
            --cat-text: #4b5563;            
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] {
            --bg-color: #111827;
            --list-bg: #1f2937;
            --list-hover: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #4b5563;
            --badge-bg: #374151;
            --badge-text: #d8b4fe;
            --cat-bg: #4b5563;
            --cat-text: #e5e7eb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* --- 2. Header & Buttons --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-btn {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* --- 3. Filter & Search Controls --- */
        .doc-controls {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .doc-controls {
                grid-template-columns: 2fr 1fr 1fr; 
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 0.2rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--list-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
            box-sizing: border-box;
            appearance: none;
        }
        
        select.form-control {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- 4. Document List & Rows (Perfect Linear Alignment) --- */
        .doc-container {
            max-width: 1200px; 
            margin: 0 auto 4rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .doc-row {
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--list-bg);
            transition: transform 0.1s, box-shadow 0.2s;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .doc-row:hover {
            background-color: var(--list-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(168, 85, 247, 0.1);
        }

        .doc-info-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            flex: 1;
            width: 100%;
        }

        .doc-sl {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap; /* Forces ID to stay on a single line */
        }

        .doc-type-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .doc-cat-badge {
            font-size: 0.75rem;
            font-weight: 500;
            background-color: var(--cat-bg);
            color: var(--cat-text);
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            white-space: nowrap;
        }

        /* Wrapper for Title & Description */
        .doc-text-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            flex: 1;
            min-width: 0; /* Important for flex-child text truncation */
            width: 100%; /* For mobile layout */
        }

        .doc-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 1; /* Limit description to 1 line to stay compact */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-info-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            justify-content: space-between;
        }

        .doc-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* --- DESKTOP SPECIFIC: FIXED WIDTHS FOR PERFECT LINEAR ALIGNMENT --- */
        @media (min-width: 768px) {
            .doc-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0.6rem 1rem;
                gap: 1rem;
            }
            
            .doc-info-left {
                flex-wrap: nowrap;
                width: auto;
            }
            
            /* Fixing widths ensures text blocks always start at the exact same horizontal position */
            .doc-sl {
                width: 125px; /* Slightly wider to guarantee DOC-2026-000 format fits */
                flex-shrink: 0;
            }
            
            .doc-type-badge {
                width: 40px;
                text-align: center;
                flex-shrink: 0;
            }
            
            .doc-cat-badge {
                width: 130px;
                text-align: center;
                flex-shrink: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .doc-text-wrapper {
                width: auto;
            }

            .doc-info-right {
                width: auto;
                justify-content: flex-end;
                flex-shrink: 0;
            }
        }

        /* --- 5. Download Button --- */
        .download-btn {
            background-color: #22c55e; 
            color: #ffffff;
            border: none;
            padding: 0.4rem 1.25rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s;
            white-space: nowrap;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #16a34a;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1rem;
            background-color: var(--list-bg);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="site">
        <div class="wrap header-inner">
            <a href="index.html" class="brand">
                <div class="mark">BB</div>
                <span class="full">BSEB Portal Hub</span>
            </a>
            <nav class="main-nav">
                <a href="https://bsebwala.in/">Home</a>
                <a href="/aihub">AIHub</a>
                <a href="/letter" class="active">Letter</a>
                <a href="/fee">Fee</a> 
                <a href="/news">News</a> 
                <a href="/about">About</a> 
                <a href="/contact">Contact</a>
            </nav>
            
            <div class="header-actions">
                <button class="lang-btn" id="langToggle">हिंदी में देखें</button>
                <button class="icon-btn" id="themeToggle" title="Toggle Theme">🌙</button>
                <button class="icon-btn menu-toggle-btn" id="menuToggle">☰</button>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT                               -->
    <!-- ========================================== -->
    <main>
        
        <!-- Controls: Search, Category, Sort -->
        <section class="doc-controls">
            <div class="control-group">
                <label class="control-label" id="lblSearch">Search</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Title or keyword...">
            </div>
            
            <div class="control-group">
                <label class="control-label" id="lblCategory">Category</label>
                <select id="categoryFilter" class="form-control">
                    <option value="all" id="optCatAll">All</option>
                    <option value="circular" id="optCatCircular">Circular</option>
                    <option value="order" id="optCatOrder">Order</option>
                    <option value="notification" id="optCatNotif">Notification</option>
                    <option value="scheme" id="optCatScheme">Scheme</option>
                    <option value="other" id="optCatOther">Other</option>
                </select>
            </div>

            <div class="control-group
