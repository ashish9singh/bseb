<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Latest News — BSEBwala</title>
    <meta name="description" content="Latest live news, updates, and announcements strictly for Bihar Board (BSEB), OFSS, BBOSE, and Bihar Education.">

    <!-- Google Fonts: Lora for headings, Inter for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           1. DESIGN TOKENS
           ============================================================ */
        :root {
            --bg:            #FDF6FF;   
            --surface:       #FFFFFF;   
            --surface-2:     #F4EBFF;   
            --border:        #E7D9F7;
            --text:          #241A38;   
            --text-muted:    #6B5C82;
            --primary:       #7B2FF7;   
            --primary-hover: #6420D9;
            --accent:        #FF6B9D;   
            --radius:        14px;
            --radius-lg:     20px;
            --shadow:        0 4px 12px rgba(123,47,247,.08);
            --font-head:     'Lora', Georgia, serif;
            --font-body:     'Inter', system-ui, sans-serif;
            --header-h:      64px;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg:            #15101F;
                --surface:       #1F1830;
                --surface-2:     #261D3A;
                --border:        #382A54;
                --text:          #F1ECFA;
                --text-muted:    #B4A6CC;
                --primary:       #B98CFF;
                --accent:        #FF9EC1;
                --shadow:        0 4px 12px rgba(0,0,0,.4);
                color-scheme: dark;
            }
        }

        /* ============================================================
           2. BASE STYLES
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: var(--font-body); line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.2; }
        a { text-decoration: none; color: inherit; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* ============================================================
           3. HEADER & BUTTONS
           ============================================================ */
        header.site {
            position: sticky; top: 0; z-index: 50;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: var(--header-h);
        }
        .brand {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-head); font-weight: 600; font-size: 1.1rem;
        }
        .brand .mark {
            width: 34px; height: 34px; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-body); font-weight: 700; font-size: .85rem;
            box-shadow: 0 4px 10px rgba(123,47,247,.35);
        }
        .header-actions {
            display: flex; align-items: center; gap: 16px;
        }
        .back-link {
            font-size: 0.9rem; font-weight: 600; color: var(--primary);
        }
        
        /* Language & Action Buttons */
        .lang-btn {
            background: var(--surface-2);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-body);
        }
        .lang-btn:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        /* ============================================================
           4. PAGE LAYOUT & HERO
           ============================================================ */
        main { padding: 40px 0 80px; }
        .page-header { margin-bottom: 40px; text-align: center; }
        .page-header h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            background: linear-gradient(100deg, var(--primary) 15%, var(--accent) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 10px;
            line-height: 1.4;
            padding-top: 0.15em; 
            padding-bottom: 0.1em;
        }
        .page-header p { color: var(--text-muted); font-size: 1.05rem; }

        /* ============================================================
           5. NEWS GRID & CARDS
           ============================================================ */
        .news-grid {
            display: grid; gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .news-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px;
            box-shadow: var(--shadow); display: flex; flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative; overflow: hidden;
        }

        .news-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0.8;
        }

        .news-card:hover {
            transform: translateY(-4px); box-shadow: 0 12px 24px rgba(123,47,247,.15);
            border-color: var(--primary);
        }

        .news-card h2 { font-size: 1.15rem; color: var(--text); margin-bottom: 12px; }
        .news-card p {
            font-size: 0.92rem; color: var(--text-muted);
            margin: 0 0 20px 0; flex-grow: 1; 
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }

        .card-meta {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
            margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
        }
        .source-tag {
            background: var(--surface-2); color: var(--primary); padding: 4px 10px;
            border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.7rem;
        }

        .read-more {
            display: inline-flex; align-items: center; gap: 6px;
            font-weight: 700; font-size: 0.95rem; color: var(--primary);
            transition: color 0.2s;
        }
        .read-more:hover { color: var(--accent); }

        /* ============================================================
           6. STATUS / LOADING / EMPTY
           ============================================================ */
        .status-container {
            text-align: center; padding: 60px 20px; grid-column: 1 / -1; color: var(--text-muted);
        }
        .spinner {
            display: inline-block; width: 40px; height: 40px;
            border: 4px solid var(--surface-2); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .last-updated { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 40px; font-weight: 500; }
        
        #load-more-container {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header class="site">
        <div class="wrap header-inner">
            <div class="brand">
                <div class="mark">BB</div>
                <span class="full">BSEB Portal Hub</span>
            </div>
            <div class="header-actions">
                <!-- Translation Toggle Button -->
                <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">हिंदी में पढ़ें</button>
                <a href="https://bsebwala.in/" class="back-link">← Back</a>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="page-header">
            <h1 id="ui-title">Live Updates & News</h1>
            <p id="ui-subtitle">The latest filtered announcements, results, and notices strictly for Bihar Board students.</p>
        </div>

        <div id="news-container" class="news-grid">
            <div class="status-container">
                <div class="spinner"></div>
                <h2 id="ui-loading">Loading latest news...</h2>
            </div>
        </div>
        
        <!-- Container for Load More Button -->
        <div id="load-more-container"></div>
        
        <div id="last-updated-text" class="last-updated"></div>
    </main>

    <script>
        // ========================================================
        // 1. STATE & DICTIONARIES
        // ========================================================
        let currentLang = 'en'; 
        let allArticles = []; 
        let showOlder = false; 
        
        // Static UI Dictionary
        const UI = {
            hi: {
                title: "लाइव अपडेट और समाचार",
                subtitle: "बिहार बोर्ड के छात्रों के लिए नवीनतम घोषणाएं, परिणाम और सूचनाएं।",
                loading: "नवीनतम समाचार लोड हो रहा है...",
                offline: "नेटवर्क समस्या के कारण कैश्ड ऑफ़लाइन समाचार प्रदर्शित किए जा रहे हैं। कृपया पुनः लोड करें।",
                empty: "अभी कोई हालिया समाचार नहीं मिला।",
                readMore: "पूरी खबर पढ़ें →",
                btnText: "Read in English",
                refresh: "समाचार फ़ीड स्वतः ताज़ा हुआ:",
                loadMore: "पुराने समाचार लोड करें (+30 दिन)"
            },
            en: {
                title: "Live Updates & News",
                subtitle: "The latest filtered announcements, results, and notices strictly for Bihar Board students.",
                loading: "Loading latest news...",
                offline: "Displaying cached offline news due to network lag. Please reload.",
                empty: "No recent matching news found.",
                readMore: "Read Full Article →",
                btnText: "हिंदी में पढ़ें",
                refresh: "News feed auto-refreshed at",
                loadMore: "Load Older News (> 30 Days)"
            }
        };

        // Offline Fallback Stories
        const FALLBACK_STORIES = [
            {
                title: "BSEB 2027 Matric & Inter Exam Registration Deadline Extended",
                hi_title: "BSEB 2027 मैट्रिक और इंटर परीक्षा पंजीकरण की अंतिम तिथि बढ़ी",
                summary: "The Bihar School Examination Board (BSEB) has officially extended the online application and registration deadline for Class 10 and 12 examinations.",
                hi_summary: "बिहार विद्यालय परीक्षा समिति (BSEB) ने कक्षा 10 और 12 की परीक्षाओं के लिए ऑनलाइन आवेदन और पंजीकरण की अंतिम तिथि आधिकारिक तौर पर बढ़ा दी है।",
                date: new Date().toISOString(), 
                sourceName: "BSEB Official",
                hi_source: "BSEB आधिकारिक",
                url: "https://secondary.biharboardonline.com"
            }
        ];

        // ========================================================
        // 2. TEXT PARSING, ENTITY CLEANING & TRANSLATION
        // ========================================================
        
        // Robust Multi-pass entity decoder that eliminates literal &nbsp; and duplicate spaces
        function decodeHTML(html) {
            if (!html) return "";
            try {
                // First pass using DOMParser
                const parser = new DOMParser();
                let doc = parser.parseFromString(html, "text/html");
                let text = doc.body.textContent || "";
                
                // Second pass if entities like &amp;nbsp; left lingering &
                if (text.includes("&")) {
                    doc = parser.parseFromString(text, "text/html");
                    text = doc.body.textContent || text;
                }

                // Strip literal '&nbsp;', non-breaking space unicode \u00a0, and collapse spaces
                return text
                    .replace(/&nbsp;/gi, " ")
                    .replace(/\u00a0/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            } catch (e) {
                return html.replace(/&nbsp;/gi, " ").trim();
            }
        }

        // Strips redundant publication name if feed tacked it on at the end of the title
        function cleanNewsTitle(title, sourceName) {
            let cleaned = decodeHTML(title);
            if (sourceName) {
                const escapedSource = sourceName.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(\\s*[-–|]\\s*|\\s+)${escapedSource}$`, "i");
                cleaned = cleaned.replace(regex, "").trim();
            }
            return cleaned;
        }

        // Native Translation using Google API
        async function translateText(text) {
            if (!text) return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch(e) {
                return text;
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            
            document.getElementById('ui-title').innerText = UI[currentLang].title;
            document.getElementById('ui-subtitle').innerText = UI[currentLang].subtitle;
            document.getElementById('langToggleBtn').innerText = UI[currentLang].btnText;
            
            renderNewsUI(false); 
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function formatDate(dateString) {
            if (!dateString) return currentLang === 'hi' ? "हाल ही में" : "Recent";
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString(currentLang === 'hi' ? 'hi-IN' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Sort helper: Newest at top (descending order)
        function sortArticlesByDate(articles) {
            return articles.sort((a, b) => {
                const timeA = a.date ? new Date(a.date).getTime() : 0;
                const timeB = b.date ? new Date(b.date).getTime() : 0;
                return (isNaN(timeB) ? 0 : timeB) - (isNaN(timeA) ? 0 : timeA);
            });
        }

        // ========================================================
        // 3. CORE RENDERING LOGIC & FILTERING
        // ========================================================
        
        window.loadOlderNews = function() {
            showOlder = true;
            renderNewsUI(false);
        };

        async function renderNewsUI(isOffline = false) {
            const now = new Date();
            const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
            
            let filteredArticles = [];
            let hasOlder = false;

            if (showOlder) {
                filteredArticles = allArticles;
            } else {
                filteredArticles = allArticles.filter(a => {
                    const articleDate = new Date(a.date);
                    if (isNaN(articleDate.getTime())) return true;
                    return (now - articleDate) <= thirtyDaysMs;
                });
                
                if (allArticles.length > filteredArticles.length) {
                    hasOlder = true;
                }
            }

            await renderArticles(filteredArticles, isOffline, hasOlder);
        }

        async function renderArticles(articles, isOffline = false, hasOlder = false) {
            const newsContainer = document.getElementById("news-container");
            const loadMoreContainer = document.getElementById("load-more-container");
            const updatedText = document.getElementById("last-updated-text");

            if (!articles || articles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><h2>${UI[currentLang].empty}</h2></div>`;
                loadMoreContainer.innerHTML = '';
                return;
            }

            if (currentLang === 'hi') {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2>अनुवाद किया जा रहा है... (Translating)</h2></div>`;
                loadMoreContainer.innerHTML = '';
                
                await Promise.all(articles.map(async (article) => {
                    if (!article.hi_title) article.hi_title = await translateText(article.title);
                    if (!article.hi_summary) article.hi_summary = await translateText(article.summary);
                    if (!article.hi_source) article.hi_source = await translateText(article.sourceName);
                }));
            }

            let htmlContent = "";
            articles.forEach(article => {
                const displayTitle = currentLang === 'hi' ? article.hi_title : article.title;
                const displaySummary = currentLang === 'hi' ? article.hi_summary : article.summary;
                const displaySource = currentLang === 'hi' ? article.hi_source : article.sourceName;
                const displayDate = formatDate(article.date);

                htmlContent += `
                    <article class="news-card">
                        <h2>${escapeHTML(displayTitle)}</h2>
                        <p>${escapeHTML(displaySummary)}</p>
                        
                        <div class="card-meta">
                            <span class="source-tag">${escapeHTML(displaySource)}</span>
                            <span>${displayDate}</span>
                        </div>
                        
                        <a href="${encodeURI(article.url || '#')}" class="read-more" target="_blank" rel="noopener">
                            ${UI[currentLang].readMore}
                        </a>
                    </article>
                `;
            });

            newsContainer.innerHTML = htmlContent;

            if (hasOlder) {
                loadMoreContainer.innerHTML = `<button class="lang-btn" style="padding: 10px 24px; font-size: 1rem;" onclick="loadOlderNews()">${UI[currentLang].loadMore}</button>`;
            } else {
                loadMoreContainer.innerHTML = '';
            }

            if (isOffline) {
                updatedText.innerText = UI[currentLang].offline;
            } else {
                const time = new Date().toLocaleTimeString(currentLang === 'hi' ? 'hi-IN' : 'en-US');
                updatedText.innerText = `${UI[currentLang].refresh} ${time}`;
            }
        }

        async function loadNews() {
            const newsContainer = document.getElementById("news-container");
            
            if (allArticles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2 id="ui-loading">${UI[currentLang].loading}</h2></div>`;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch("https://bsebwala-news-api2.vercel.app/api/news", { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("HTTP error " + response.status);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    const parsedArticles = data.articles.map(article => {
                        const rawSource = decodeHTML(article.source || "News Source");
                        return {
                            title: cleanNewsTitle(article.title || "News Update", rawSource),
                            summary: decodeHTML(article.description || "Click the link to read more."),
                            sourceName: rawSource,
                            url: article.url || "#",
                            date: article.publishedAt || article.updatedAt || article.date
                        };
                    });
                    
                    // Sort descending (latest news first)
                    allArticles = sortArticlesByDate(parsedArticles);
                    await renderNewsUI(false);
                } else {
                    throw new Error("Empty articles array");
                }

            } catch (error) {
                console.warn("API Error. Falling back to offline stories.", error);
                allArticles = sortArticlesByDate(FALLBACK_STORIES);
                await renderNewsUI(true);
            }
        }

        // Initialize immediately
        loadNews();

        // Auto-refresh seamlessly in the background every 5 minutes
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
