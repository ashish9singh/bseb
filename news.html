<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Latest News — BSEB Portal Hub</title>
    <meta name="description" content="Latest live news, updates, and announcements strictly for Bihar Board (BSEB), OFSS, BBOSE, and Bihar Education.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Master Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation with Shared Menu & Theme Toggle -->
    <header class="site-header">
        <div class="wrap header-inner">
            <a href="https://bsebwala.in/" class="site-brand">
                <span class="brand-logo">BB</span>
                <span>BSEB Portal Hub</span>
            </a>

            <!-- Shared Portal Navigation Menu -->
            <nav class="main-nav">
                <a href="https://bsebwala.in/">Home</a>
                <a href="https://bsebwala.in/">Letter</a>
                <a href="fee.html">Fee</a>
                <a href="news.html" class="active">News</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-actions">
                <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">हिंदी में पढ़ें</button>
                <button class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="page-header">
            <h1 id="ui-title">Live Updates & News</h1>
            <p id="ui-subtitle">The latest filtered announcements, results, and notices strictly for Bihar Board students.</p>
        </div>

        <!-- Categorized Quick-Filter Chips -->
        <div class="news-filters" id="categoryChips">
            <button class="news-chip active" data-cat="all" onclick="filterCategory('all')">ALL (सभी)</button>
            <button class="news-chip" data-cat="secondary" onclick="filterCategory('secondary')">CLASS 9/10</button>
            <button class="news-chip" data-cat="senior" onclick="filterCategory('senior')">CLASS 11/12</button>
            <button class="news-chip" data-cat="bed_deled" onclick="filterCategory('bed_deled')">D.El.Ed/B.Ed</button>
            <button class="news-chip" data-cat="stet_tre" onclick="filterCategory('stet_tre')">STET/TRE</button>
            <button class="news-chip" data-cat="teachers" onclick="filterCategory('teachers')">TEACHERS</button>
            <button class="news-chip" data-cat="scholarship" onclick="filterCategory('scholarship')">SCHOLARSHIP</button>
        </div>
        
        <!-- News Cards Grid -->
        <div id="news-container" class="news-grid">
            <div class="status-container">
                <div class="spinner"></div>
                <h2 id="ui-loading">Loading latest news...</h2>
            </div>
        </div>
        
        <div id="load-more-container" style="text-align: center; margin-top: 40px;"></div>
        <div id="last-updated-text" class="last-updated"></div>
    </main>

    <script>
        let currentLang = 'en'; 
        let allArticles = []; 
        let currentCategory = 'all';
        let showOlder = false; 
        
        const UI = {
            hi: {
                title: "लाइव अपडेट और समाचार",
                subtitle: "बिहार बोर्ड के छात्रों और शिक्षकों के लिए नवीनतम घोषणाएं, परिणाम और सूचनाएं।",
                loading: "नवीनतम समाचार लोड हो रहा है...",
                offline: "नेटवर्क समस्या के कारण कैश्ड ऑफ़लाइन समाचार प्रदर्शित किए जा रहे हैं।",
                empty: "इस श्रेणी में अभी कोई समाचार उपलब्ध नहीं है।",
                readMore: "पूरी खबर पढ़ें →",
                btnText: "Read in English",
                refresh: "समाचार फ़ीड स्वतः ताज़ा हुआ:",
                loadMore: "पुराने समाचार लोड करें (+30 दिन)",
                takeaways: "मुख्य बिंदु (Key Takeaways):",
                shareText: "शेयर करें",
                readTime: "30 सेकंड पठन"
            },
            en: {
                title: "Live Updates & News",
                subtitle: "The latest filtered announcements, results, and notices strictly for Bihar Board students.",
                loading: "Loading latest news...",
                offline: "Displaying cached offline news due to network lag.",
                empty: "No news found in this category.",
                readMore: "Read Full Article →",
                btnText: "हिंदी में पढ़ें",
                refresh: "News feed auto-refreshed at",
                loadMore: "Load Older News (> 30 Days)",
                takeaways: "Key Takeaways:",
                shareText: "Share",
                readTime: "30 sec read"
            }
        };

        const FALLBACK_STORIES = [
            {
                title: "Bihar DElEd Answer Key 2026 Out @bsebdeled.com, Steps to Download Official PDF",
                hi_title: "Bihar DElEd Answer Key 2026 आउट @bsebdeled.com, आधिकारिक PDF डाउनलोड करने के चरण",
                summary: "The Bihar School Examination Board (BSEB) has officially released the DElEd Answer Key. Candidates can file online objections through the official portal.",
                hi_summary: "बिहार विद्यालय परीक्षा समिति (BSEB) ने आधिकारिक तौर पर DElEd आंसर की जारी कर दी है। अभ्यर्थी आधिकारिक पोर्टल पर ऑनलाइन आपत्ति दर्ज कर सकते हैं।",
                date: "2026-10-03T11:40:00Z", 
                sourceName: "ADDA247",
                hi_source: "ADDA247",
                url: "https://bsebdeled.com"
            }
        ];

        // Theme Toggle Engine
        (function themeModule(){
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            const STORAGE_KEY = 'bseb-hub-theme';

            function apply(theme){
                if (theme === 'dark' || theme === 'light'){
                    root.setAttribute('data-theme', theme);
                } else {
                    root.removeAttribute('data-theme');
                }
                const isDark = (root.getAttribute('data-theme') === 'dark' ||
                    (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches));
                btn.textContent = isDark ? '☀️' : '🌙';
            }

            let saved = null;
            try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
            apply(saved);

            btn.addEventListener('click', function(){
                const current = root.getAttribute('data-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                const next = current === 'dark' ? 'light' : 'dark';
                apply(next);
                try { localStorage.setItem(STORAGE_KEY, next); } catch(e){}
            });
        })();

        function decodeHTML(html) {
            if (!html) return "";
            try {
                const parser = new DOMParser();
                let doc = parser.parseFromString(html, "text/html");
                let text = doc.body.textContent || "";
                if (text.includes("&")) {
                    doc = parser.parseFromString(text, "text/html");
                    text = doc.body.textContent || text;
                }
                return text.replace(/&nbsp;/gi, " ").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
            } catch (e) {
                return html.replace(/&nbsp;/gi, " ").trim();
            }
        }

        function cleanNewsTitle(title, sourceName) {
            let cleaned = decodeHTML(title);
            if (sourceName) {
                const escapedSource = sourceName.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(\\s*[-–|]\\s*|\\s+)${escapedSource}$`, "i");
                cleaned = cleaned.replace(regex, "").trim();
            }
            return cleaned;
        }

        async function translateText(text) {
            if (!text) return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch(e) {
                return text;
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            document.getElementById('ui-title').innerText = UI[currentLang].title;
            document.getElementById('ui-subtitle').innerText = UI[currentLang].subtitle;
            document.getElementById('langToggleBtn').innerText = UI[currentLang].btnText;
            renderNewsUI(false); 
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Exact UTC date and time formatter
        function formatDateTime(dateInput) {
            if (!dateInput) return currentLang === 'hi' ? "हाल ही में" : "Recent";
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return dateInput;

            return d.toLocaleString(currentLang === 'hi' ? 'hi-IN' : 'en-US', {
                timeZone: 'UTC',
                timeZoneName: 'short',
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

// Automatic Category Tagger
        function assignCategory(title, summary) {
            const combined = (title + " " + summary).toLowerCase();
            
            // 1. D.El.Ed / B.Ed
            if (/deled|d\.el\.ed|b\.ed|bed|डीएलएड|बीएड|d\.ed/.test(combined)) return 'bed_deled';
            
            // 2. STET / TRE (Exams for teachers)
            if (/stet|bpsc tre|tre 1|tre 2|tre 3|tre 4|btet|ctet|एसटीईटी|टीआरई/.test(combined)) return 'stet_tre';
            
            // 3. Teachers & Admin (General)
            if (/teacher|shikshak|niyojit|sakshamta|transfer|वेतन|शिक्षक|नियोजित|सक्षमता|e-shikshakosh/.test(combined)) return 'teachers';
            
            // 4. Class 9/10 (Secondary)
            if (/matric|10th|9th|class 9|class 10|कक्षा 9|कक्षा 10|माध्यमिक|मैट्रिक/.test(combined)) return 'secondary';
            
            // 5. Class 11/12 (Senior Secondary)
            if (/inter|12th|11th|class 11|class 12|कक्षा 11|कक्षा 12|इंटर|ofss/.test(combined)) return 'senior';
            
            // 6. Scholarships
            if (/scholarship|medhasoft|pms|protsahan|nmms|kanya utthan|छात्रवृत्ति|मेधासॉफ्ट|कल्याण/.test(combined)) return 'scholarship';
            
            // Fallback for general board news
            return 'general';
        }

        // Break text into key bullet points
        function formatBulletTakeaways(summary) {
            if (!summary) return ['Click the link below for complete details.'];
            
            // Split sentences on period or exclamation
            const sentences = summary
                .split(/(?<=[.!?।])\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 12);

            if (sentences.length === 0) return [summary];
            return sentences.slice(0, 2); // Show up to 2 sharp takeaways
        }

        // 1-Tap WhatsApp Share Generator
        function shareArticleWhatsApp(title, takeaway, url, date) {
            const msg = `📢 *${title}*\n\n📌 *मुख्य बिंदु:*\n• ${takeaway}\n\n📅 *तारीख:* ${date}\n🔗 *पूरा विवरण:* ${url}\n\n— via https://bsebwala.in/news.html`;
            const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg);
            window.open(waUrl, "_blank", "noopener,noreferrer");
        }

        // Filter Category Handler
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.news-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.cat === cat);
            });
            renderNewsUI(false);
        }

        function sortArticlesByDate(articles) {
            return articles.sort((a, b) => {
                const timeA = a.date ? new Date(a.date).getTime() : 0;
                const timeB = b.date ? new Date(b.date).getTime() : 0;
                return (isNaN(timeB) ? 0 : timeB) - (isNaN(timeA) ? 0 : timeA);
            });
        }

        window.loadOlderNews = function() {
            showOlder = true;
            renderNewsUI(false);
        };

        async function renderNewsUI(isOffline = false) {
            const now = new Date();
            const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
            
            // 1. Time filter
            let filtered = showOlder ? allArticles : allArticles.filter(a => {
                const d = new Date(a.date);
                return isNaN(d.getTime()) || (now - d) <= thirtyDaysMs;
            });
            
            const hasOlder = !showOlder && (allArticles.length > filtered.length);

            // 2. Category filter
            if (currentCategory !== 'all') {
                filtered = filtered.filter(a => a.category === currentCategory);
            }

            await renderArticles(filtered, isOffline, hasOlder);
        }

        async function renderArticles(articles, isOffline = false, hasOlder = false) {
            const newsContainer = document.getElementById("news-container");
            const loadMoreContainer = document.getElementById("load-more-container");
            const updatedText = document.getElementById("last-updated-text");

            if (!articles || articles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><h2>${UI[currentLang].empty}</h2></div>`;
                loadMoreContainer.innerHTML = '';
                return;
            }

            if (currentLang === 'hi') {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2>अनुवाद किया जा रहा है... (Translating)</h2></div>`;
                loadMoreContainer.innerHTML = '';
                
                await Promise.all(articles.map(async (article) => {
                    if (!article.hi_title) article.hi_title = await translateText(article.title);
                    if (!article.hi_summary) article.hi_summary = await translateText(article.summary);
                    if (!article.hi_source) article.hi_source = await translateText(article.sourceName);
                }));
            }

            let htmlContent = "";
            articles.forEach(article => {
                const displayTitle = currentLang === 'hi' ? article.hi_title : article.title;
                const displaySummary = currentLang === 'hi' ? article.hi_summary : article.summary;
                const displaySource = currentLang === 'hi' ? article.hi_source : article.sourceName;
                const displayDateTime = formatDateTime(article.date);
                const bullets = formatBulletTakeaways(displaySummary);
                const firstTakeaway = bullets[0] || displaySummary;

                htmlContent += `
                    <article class="news-card">
                        <div class="card-top-tags">
                            <span class="source-tag">${escapeHTML(displaySource)}</span>
                            <span class="read-time-tag">⚡ ${UI[currentLang].readTime}</span>
                        </div>

                        <h2>${escapeHTML(displayTitle)}</h2>

                        <!-- Bullet Takeaways -->
                        <div class="takeaways-wrapper">
                            <div class="takeaways-label">📌 ${UI[currentLang].takeaways}</div>
                            <ul class="takeaways-list">
                                ${bullets.map(b => `<li>${escapeHTML(b)}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="card-meta">
                            <span>🕒 ${displayDateTime}</span>
                        </div>
                        
                        <div class="card-actions-row">
                            <a href="${encodeURI(article.url || '#')}" class="read-more" target="_blank" rel="noopener">
                                ${UI[currentLang].readMore}
                            </a>

                            <!-- 1-Tap WhatsApp Share Button -->
                            <button type="button" class="whatsapp-share-btn" 
                                onclick="shareArticleWhatsApp('${escapeHTML(displayTitle.replace(/'/g, "\\'"))}', '${escapeHTML(firstTakeaway.replace(/'/g, "\\'"))}', '${encodeURI(article.url || '')}', '${displayDateTime}')">
                                <span>🟢 ${UI[currentLang].shareText}</span>
                            </button>
                        </div>
                    </article>
                `;
            });

            newsContainer.innerHTML = htmlContent;

            if (hasOlder) {
                loadMoreContainer.innerHTML = `<button class="lang-btn" style="padding: 10px 24px; font-size: 1rem;" onclick="loadOlderNews()">${UI[currentLang].loadMore}</button>`;
            } else {
                loadMoreContainer.innerHTML = '';
            }

            if (isOffline) {
                updatedText.innerText = UI[currentLang].offline;
            } else {
                const time = new Date().toLocaleTimeString(currentLang === 'hi' ? 'hi-IN' : 'en-US');
                updatedText.innerText = `${UI[currentLang].refresh} ${time}`;
            }
        }

        async function loadNews() {
            const newsContainer = document.getElementById("news-container");
            
            if (allArticles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2 id="ui-loading">${UI[currentLang].loading}</h2></div>`;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch("https://bsebwala-news-api2.vercel.app/api/news", { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("HTTP error " + response.status);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    const parsedArticles = data.articles.map(article => {
                        const rawSource = decodeHTML(article.source || "News Source");
                        const rawDate = article.publishedAt || article.pubDate || article.date;
                        const titleClean = cleanNewsTitle(article.title || "News Update", rawSource);
                        const summaryClean = decodeHTML(article.description || "Click to read full details.");

                        return {
                            title: titleClean,
                            summary: summaryClean,
                            sourceName: rawSource,
                            url: article.url || "#",
                            date: rawDate,
                            category: assignCategory(titleClean, summaryClean)
                        };
                    });
                    
                    allArticles = sortArticlesByDate(parsedArticles);
                    await renderNewsUI(false);
                } else {
                    throw new Error("Empty articles array");
                }

            } catch (error) {
                console.warn("API Error. Falling back to offline stories.", error);
                allArticles = sortArticlesByDate(FALLBACK_STORIES.map(s => ({
                    ...s,
                    category: assignCategory(s.title, s.summary)
                })));
                await renderNewsUI(true);
            }
        }

        loadNews();
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
