<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Latest News — BSEB Portal Hub</title>
    <meta name="description" content="Latest live news, updates, and announcements strictly for Bihar Board (BSEB), OFSS, BBOSE, and Bihar Education.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Master Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation with Shared Menu & Theme Toggle -->
    <header class="site-header">
        <div class="wrap header-inner">
            <a href="https://bsebwala.in/" class="site-brand">
                <span class="brand-logo">BB</span>
                <span>BSEB Portal Hub</span>
            </a>

            <!-- Menu with Active News Highlight -->
            <nav class="main-nav">
                <a href="https://bsebwala.in/">Home</a>
                <a href="https://bsebwala.in/">Letter</a>
                <a href="fee.html">Fee</a>
                <a href="news.html" class="active">News</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-actions">
                <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">हिंदी में पढ़ें</button>
                <button class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="page-header">
            <h1 id="ui-title">Live Updates & News</h1>
            <p id="ui-subtitle">The latest filtered announcements, results, and notices strictly for Bihar Board students.</p>
        </div>

        <div id="news-container" class="news-grid">
            <div class="status-container">
                <div class="spinner"></div>
                <h2 id="ui-loading">Loading latest news...</h2>
            </div>
        </div>
        
        <div id="load-more-container" style="text-align: center; margin-top: 40px;"></div>
        <div id="last-updated-text" class="last-updated"></div>
    </main>

    <script>
        let currentLang = 'en'; 
        let allArticles = []; 
        let showOlder = false; 
        
        const UI = {
            hi: {
                title: "लाइव अपडेट और समाचार",
                subtitle: "बिहार बोर्ड के छात्रों के लिए नवीनतम घोषणाएं, परिणाम और सूचनाएं।",
                loading: "नवीनतम समाचार लोड हो रहा है...",
                offline: "नेटवर्क समस्या के कारण कैश्ड ऑफ़लाइन समाचार प्रदर्शित किए जा रहे हैं। कृपया पुनः लोड करें।",
                empty: "अभी कोई हालिया समाचार नहीं मिला।",
                readMore: "पूरी खबर पढ़ें →",
                btnText: "Read in English",
                refresh: "समाचार फ़ीड स्वतः ताज़ा हुआ:",
                loadMore: "पुराने समाचार लोड करें (+30 दिन)"
            },
            en: {
                title: "Live Updates & News",
                subtitle: "The latest filtered announcements, results, and notices strictly for Bihar Board students.",
                loading: "Loading latest news...",
                offline: "Displaying cached offline news due to network lag. Please reload.",
                empty: "No recent matching news found.",
                readMore: "Read Full Article →",
                btnText: "हिंदी में पढ़ें",
                refresh: "News feed auto-refreshed at",
                loadMore: "Load Older News (> 30 Days)"
            }
        };

        const FALLBACK_STORIES = [
            {
                title: "BSEB 2027 Matric & Inter Exam Registration Deadline Extended",
                hi_title: "BSEB 2027 मैट्रिक और इंटर परीक्षा पंजीकरण की अंतिम तिथि बढ़ी",
                summary: "The Bihar School Examination Board (BSEB) has officially extended the online application and registration deadline for Class 10 and 12 examinations.",
                hi_summary: "बिहार विद्यालय परीक्षा समिति (BSEB) ने कक्षा 10 और 12 की परीक्षाओं के लिए ऑनलाइन आवेदन और पंजीकरण की अंतिम तिथि आधिकारिक तौर पर बढ़ा दी है।",
                date: new Date().toISOString(), 
                sourceName: "BSEB Official",
                hi_source: "BSEB आधिकारिक",
                url: "https://secondary.biharboardonline.com"
            }
        ];

        (function themeModule(){
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            const STORAGE_KEY = 'bseb-hub-theme';

            function apply(theme){
                if (theme === 'dark' || theme === 'light'){
                    root.setAttribute('data-theme', theme);
                } else {
                    root.removeAttribute('data-theme');
                }
                const isDark = (root.getAttribute('data-theme') === 'dark' ||
                    (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches));
                btn.textContent = isDark ? '☀️' : '🌙';
            }

            let saved = null;
            try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
            apply(saved);

            btn.addEventListener('click', function(){
                const current = root.getAttribute('data-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                const next = current === 'dark' ? 'light' : 'dark';
                apply(next);
                try { localStorage.setItem(STORAGE_KEY, next); } catch(e){}
            });
        })();

        function decodeHTML(html) {
            if (!html) return "";
            try {
                const parser = new DOMParser();
                let doc = parser.parseFromString(html, "text/html");
                let text = doc.body.textContent || "";
                
                if (text.includes("&")) {
                    doc = parser.parseFromString(text, "text/html");
                    text = doc.body.textContent || text;
                }

                return text
                    .replace(/&nbsp;/gi, " ")
                    .replace(/\u00a0/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            } catch (e) {
                return html.replace(/&nbsp;/gi, " ").trim();
            }
        }

        function cleanNewsTitle(title, sourceName) {
            let cleaned = decodeHTML(title);
            if (sourceName) {
                const escapedSource = sourceName.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(\\s*[-–|]\\s*|\\s+)${escapedSource}$`, "i");
                cleaned = cleaned.replace(regex, "").trim();
            }
            return cleaned;
        }

        async function translateText(text) {
            if (!text) return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch(e) {
                return text;
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            
            document.getElementById('ui-title').innerText = UI[currentLang].title;
            document.getElementById('ui-subtitle').innerText = UI[currentLang].subtitle;
            document.getElementById('langToggleBtn').innerText = UI[currentLang].btnText;
            
            renderNewsUI(false); 
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function formatDate(dateString) {
            if (!dateString) return currentLang === 'hi' ? "हाल ही में" : "Recent";
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString(currentLang === 'hi' ? 'hi-IN' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function sortArticlesByDate(articles) {
            return articles.sort((a, b) => {
                const timeA = a.date ? new Date(a.date).getTime() : 0;
                const timeB = b.date ? new Date(b.date).getTime() : 0;
                return (isNaN(timeB) ? 0 : timeB) - (isNaN(timeA) ? 0 : timeA);
            });
        }

        window.loadOlderNews = function() {
            showOlder = true;
            renderNewsUI(false);
        };

        async function renderNewsUI(isOffline = false) {
            const now = new Date();
            const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
            
            let filteredArticles = [];
            let hasOlder = false;

            if (showOlder) {
                filteredArticles = allArticles;
            } else {
                filteredArticles = allArticles.filter(a => {
                    const articleDate = new Date(a.date);
                    if (isNaN(articleDate.getTime())) return true;
                    return (now - articleDate) <= thirtyDaysMs;
                });
                
                if (allArticles.length > filteredArticles.length) {
                    hasOlder = true;
                }
            }

            await renderArticles(filteredArticles, isOffline, hasOlder);
        }

        async function renderArticles(articles, isOffline = false, hasOlder = false) {
            const newsContainer = document.getElementById("news-container");
            const loadMoreContainer = document.getElementById("load-more-container");
            const updatedText = document.getElementById("last-updated-text");

            if (!articles || articles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><h2>${UI[currentLang].empty}</h2></div>`;
                loadMoreContainer.innerHTML = '';
                return;
            }

            if (currentLang === 'hi') {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2>अनुवाद किया जा रहा है... (Translating)</h2></div>`;
                loadMoreContainer.innerHTML = '';
                
                await Promise.all(articles.map(async (article) => {
                    if (!article.hi_title) article.hi_title = await translateText(article.title);
                    if (!article.hi_summary) article.hi_summary = await translateText(article.summary);
                    if (!article.hi_source) article.hi_source = await translateText(article.sourceName);
                }));
            }

            let htmlContent = "";
            articles.forEach(article => {
                const displayTitle = currentLang === 'hi' ? article.hi_title : article.title;
                const displaySummary = currentLang === 'hi' ? article.hi_summary : article.summary;
                const displaySource = currentLang === 'hi' ? article.hi_source : article.sourceName;
                const displayDate = formatDate(article.date);

                htmlContent += `
                    <article class="news-card">
                        <h2>${escapeHTML(displayTitle)}</h2>
                        <p>${escapeHTML(displaySummary)}</p>
                        
                        <div class="card-meta">
                            <span class="source-tag">${escapeHTML(displaySource)}</span>
                            <span>${displayDate}</span>
                        </div>
                        
                        <a href="${encodeURI(article.url || '#')}" class="read-more" target="_blank" rel="noopener">
                            ${UI[currentLang].readMore}
                        </a>
                    </article>
                `;
            });

            newsContainer.innerHTML = htmlContent;

            if (hasOlder) {
                loadMoreContainer.innerHTML = `<button class="lang-btn" style="padding: 10px 24px; font-size: 1rem;" onclick="loadOlderNews()">${UI[currentLang].loadMore}</button>`;
            } else {
                loadMoreContainer.innerHTML = '';
            }

            if (isOffline) {
                updatedText.innerText = UI[currentLang].offline;
            } else {
                const time = new Date().toLocaleTimeString(currentLang === 'hi' ? 'hi-IN' : 'en-US');
                updatedText.innerText = `${UI[currentLang].refresh} ${time}`;
            }
        }

        async function loadNews() {
            const newsContainer = document.getElementById("news-container");
            
            if (allArticles.length === 0) {
                newsContainer.innerHTML = `<div class="status-container"><div class="spinner"></div><h2 id="ui-loading">${UI[currentLang].loading}</h2></div>`;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch("https://bsebwala-news-api2.vercel.app/api/news", { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("HTTP error " + response.status);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    const parsedArticles = data.articles.map(article => {
                        const rawSource = decodeHTML(article.source || "News Source");
                        return {
                            title: cleanNewsTitle(article.title || "News Update", rawSource),
                            summary: decodeHTML(article.description || "Click the link to read more."),
                            sourceName: rawSource,
                            url: article.url || "#",
                            date: article.publishedAt || article.updatedAt || article.date
                        };
                    });
                    
                    allArticles = sortArticlesByDate(parsedArticles);
                    await renderNewsUI(false);
                } else {
                    throw new Error("Empty articles array");
                }

            } catch (error) {
                console.warn("API Error. Falling back to offline stories.", error);
                allArticles = sortArticlesByDate(FALLBACK_STORIES);
                await renderNewsUI(true);
            }
        }

        loadNews();
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
